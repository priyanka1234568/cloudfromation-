AWSTemplateFormatVersion: '2010-09-09'
Description: DailyKart Next.js application with MySQL and Route 53 in Mumbai; enable HTTPS after DNS delegation

Parameters:
  DomainName:
    Description: Registered domain name for the website
    Type: String
    Default: dailykarrt.online
    AllowedPattern: '^[a-zA-Z0-9.-]+\.[a-zA-Z]{2,}$'
    ConstraintDescription: Enter a valid domain name, such as example.com.

  EnableHTTPS:
    Description: Set to true only after the domain uses the Route 53 name servers from the stack outputs
    Type: String
    Default: 'false'
    AllowedValues:
      - 'false'
      - 'true'

  AppCommit:
    Description: Inspected DailyKart source revision to deploy
    Type: String
    Default: 6797e8310c602624fa1fa0f312b96798e9843609
    AllowedPattern: '^[a-fA-F0-9]{40}$'
    ConstraintDescription: Enter a 40-character Git commit SHA.

Conditions:
  CreateHttpsCondition: !Equals [!Ref EnableHTTPS, 'true']

Resources:
  DailyKartVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: DailyKart-VPC

  DailyKartInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: DailyKart-IGW

  DailyKartInternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref DailyKartInternetGateway
      VpcId: !Ref DailyKartVPC

  DailyKartPublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DailyKartVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: DailyKart-Public-A

  DailyKartPublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DailyKartVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: DailyKart-Public-B

  DailyKartPrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DailyKartVPC
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: DailyKart-Database-A

  DailyKartPrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref DailyKartVPC
      CidrBlock: 10.0.12.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: DailyKart-Database-B

  DailyKartPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref DailyKartVPC
      Tags:
        - Key: Name
          Value: DailyKart-Public-Routes

  DailyKartPublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: DailyKartInternetGatewayAttachment
    Properties:
      RouteTableId: !Ref DailyKartPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref DailyKartInternetGateway

  DailyKartPublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref DailyKartPublicRouteTable
      SubnetId: !Ref DailyKartPublicSubnet1

  DailyKartPublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref DailyKartPublicRouteTable
      SubnetId: !Ref DailyKartPublicSubnet2

  DailyKartHostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Ref DomainName
      HostedZoneConfig:
        Comment: DailyKart public DNS zone

  DailyKartALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow public HTTP and HTTPS to the load balancer
      VpcId: !Ref DailyKartVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: DailyKart-ALB-SG

  DailyKartEC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow application traffic only from the load balancer
      VpcId: !Ref DailyKartVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !GetAtt DailyKartALBSecurityGroup.GroupId
      Tags:
        - Key: Name
          Value: DailyKart-App-SG

  DailyKartRDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow MySQL only from the application server
      VpcId: !Ref DailyKartVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !GetAtt DailyKartEC2SecurityGroup.GroupId
      Tags:
        - Key: Name
          Value: DailyKart-Database-SG

  DailyKartDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for the DailyKart database
      SubnetIds:
        - !Ref DailyKartPrivateSubnet1
        - !Ref DailyKartPrivateSubnet2
      Tags:
        - Key: Name
          Value: DailyKart-DB-Subnets

  DailyKartDatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Generated DailyKart RDS credentials
      GenerateSecretString:
        SecretStringTemplate: '{"username":"dailykartadmin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
      Tags:
        - Key: Name
          Value: DailyKart-Database-Credentials

  DailyKartRDS:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceClass: db.t3.micro
      Engine: mysql
      AllocatedStorage: '20'
      StorageType: gp3
      DBName: dailykart
      MasterUsername: dailykartadmin
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DailyKartDatabaseSecret}:SecretString:password}}'
      VPCSecurityGroups:
        - !GetAtt DailyKartRDSSecurityGroup.GroupId
      DBSubnetGroupName: !Ref DailyKartDBSubnetGroup
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      StorageEncrypted: true
      AutoMinorVersionUpgrade: true
      Tags:
        - Key: Name
          Value: DailyKart-MySQL

  DailyKartLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/dailykart/${AWS::StackName}/application'
      RetentionInDays: 14

  DailyKartEC2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadDailyKartDatabaseSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref DailyKartDatabaseSecret

  DailyKartInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref DailyKartEC2Role

  DailyKartBootstrapWaitHandle:
    Type: AWS::CloudFormation::WaitConditionHandle

  DailyKartBootstrapWaitCondition:
    Type: AWS::CloudFormation::WaitCondition
    Properties:
      Handle: !Ref DailyKartBootstrapWaitHandle
      Timeout: '3600'
      Count: 1

  DailyKartEC2:
    Type: AWS::EC2::Instance
    DependsOn:
      - DailyKartPublicDefaultRoute
      - DailyKartPublicSubnet1RouteTableAssociation
    Properties:
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      InstanceType: t3.medium
      IamInstanceProfile: !Ref DailyKartInstanceProfile
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      NetworkInterfaces:
        - AssociatePublicIpAddress: true
          DeviceIndex: '0'
          SubnetId: !Ref DailyKartPublicSubnet1
          GroupSet:
            - !GetAtt DailyKartEC2SecurityGroup.GroupId
      Tags:
        - Key: Name
          Value: DailyKart-App
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -Eeuo pipefail
          exec > >(tee -a /var/log/cloud-init-output.log) 2>&1

          SIGNAL_URL='${DailyKartBootstrapWaitHandle}'
          signal_failure() {
            trap - ERR
            curl -fsS -X PUT -H 'Content-Type:' --data-binary '{"Status":"FAILURE","UniqueId":"DailyKartEC2","Reason":"Application bootstrap failed","Data":"Check /var/log/cloud-init-output.log"}' "$SIGNAL_URL"
          }
          trap signal_failure ERR

          dnf update -y
          curl --fail --silent --show-error --location https://rpm.nodesource.com/setup_22.x -o /tmp/nodesource_setup.sh
          bash /tmp/nodesource_setup.sh
          dnf install -y nodejs git jq mariadb105 awscli-2 amazon-cloudwatch-agent

          DB_ENDPOINT='${DailyKartRDS.Endpoint.Address}'
          DB_SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id '${DailyKartDatabaseSecret}' \
            --query SecretString \
            --output text \
            --region '${AWS::Region}')
          DB_USERNAME=$(printf '%s' "$DB_SECRET_JSON" | jq -r '.username')
          DB_PASSWORD=$(printf '%s' "$DB_SECRET_JSON" | jq -r '.password')

          cat > /root/.my.cnf <<EOF
          [client]
          host=$DB_ENDPOINT
          user=$DB_USERNAME
          password=$DB_PASSWORD
          database=dailykart
          EOF
          chmod 600 /root/.my.cnf

          DB_READY=false
          for attempt in $(seq 1 60); do
            if mysql --defaults-extra-file=/root/.my.cnf -e 'SELECT 1' >/dev/null 2>&1; then
              DB_READY=true
              break
            fi
            sleep 10
          done
          if [ "$DB_READY" != true ]; then
            echo "Database did not become ready in time"
            exit 1
          fi

          install -d -m 0755 /opt/dailykart
          git -C /opt/dailykart init
          git -C /opt/dailykart remote add origin https://github.com/priyanka1234568/DailyKart1.git
          git -C /opt/dailykart fetch --depth 1 origin '${AppCommit}'
          git -C /opt/dailykart checkout --detach FETCH_HEAD

          mysql --defaults-extra-file=/root/.my.cnf < /opt/dailykart/scripts/01-init-database.sql
          mysql --defaults-extra-file=/root/.my.cnf < /opt/dailykart/scripts/02-seed-data.sql

          cat > /etc/dailykart.env <<EOF
          NODE_ENV=production
          MYSQL_HOST=$DB_ENDPOINT
          MYSQL_PORT=3306
          MYSQL_USER=$DB_USERNAME
          MYSQL_PASSWORD=$DB_PASSWORD
          MYSQL_DATABASE=dailykart
          EOF
          chmod 600 /etc/dailykart.env

          cd /opt/dailykart
          npm ci
          set -a
          . /etc/dailykart.env
          set +a
          npm run build

          useradd --system --home-dir /opt/dailykart --shell /sbin/nologin dailykart
          chown -R dailykart:dailykart /opt/dailykart
          install -o dailykart -g dailykart -m 0640 /dev/null /var/log/dailykart.log

          cat > /etc/systemd/system/dailykart.service <<'EOF'
          [Unit]
          Description=DailyKart Next.js application
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=dailykart
          Group=dailykart
          WorkingDirectory=/opt/dailykart
          EnvironmentFile=/etc/dailykart.env
          ExecStart=/usr/bin/npm start -- --hostname 0.0.0.0 --port 3000
          Restart=on-failure
          RestartSec=5
          StandardOutput=append:/var/log/dailykart.log
          StandardError=append:/var/log/dailykart.log

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable --now dailykart

          cat > /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json <<'EOF'
          {
            "logs": {
              "logs_collected": {
                "files": {
                  "collect_list": [
                    {
                      "file_path": "/var/log/cloud-init-output.log",
                      "log_group_name": "${DailyKartLogGroup}",
                      "log_stream_name": "ec2-userdata"
                    },
                    {
                      "file_path": "/var/log/dailykart.log",
                      "log_group_name": "${DailyKartLogGroup}",
                      "log_stream_name": "dailykart-app"
                    }
                  ]
                }
              }
            }
          }
          EOF
          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
            -a fetch-config -m ec2 \
            -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json -s

          APP_READY=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              APP_READY=true
              break
            fi
            sleep 5
          done
          if [ "$APP_READY" != true ]; then
            echo "DailyKart did not become healthy on port 3000"
            exit 1
          fi

          trap - ERR
          curl -fsS -X PUT -H 'Content-Type:' \
            --data-binary '{"Status":"SUCCESS","UniqueId":"DailyKartEC2","Data":"Application is healthy"}' \
            "$SIGNAL_URL"

  DailyKartLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      SecurityGroups:
        - !GetAtt DailyKartALBSecurityGroup.GroupId
      Subnets:
        - !Ref DailyKartPublicSubnet1
        - !Ref DailyKartPublicSubnet2
      Tags:
        - Key: Name
          Value: DailyKart-ALB

  DailyKartCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: CreateHttpsCondition
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames:
        - !Sub 'www.${DomainName}'
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref DailyKartHostedZone
        - DomainName: !Sub 'www.${DomainName}'
          HostedZoneId: !Ref DailyKartHostedZone
      Tags:
        - Key: Name
          Value: DailyKart-HTTPS

  DailyKartTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 3000
      Protocol: HTTP
      TargetType: instance
      VpcId: !Ref DailyKartVPC
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckPath: /
      Matcher:
        HttpCode: '200-399'
      Targets:
        - Id: !Ref DailyKartEC2
          Port: 3000

  DailyKartHTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref DailyKartLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - !If
          - CreateHttpsCondition
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: '443'
              StatusCode: HTTP_301
          - Type: forward
            TargetGroupArn: !Ref DailyKartTargetGroup

  DailyKartHTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: CreateHttpsCondition
    Properties:
      LoadBalancerArn: !Ref DailyKartLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref DailyKartCertificate
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref DailyKartTargetGroup

  DailyKartRootDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref DailyKartHostedZone
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt DailyKartLoadBalancer.DNSName
        HostedZoneId: !GetAtt DailyKartLoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: true

  DailyKartWwwDNSRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref DailyKartHostedZone
      Name: !Sub 'www.${DomainName}'
      Type: A
      AliasTarget:
        DNSName: !GetAtt DailyKartLoadBalancer.DNSName
        HostedZoneId: !GetAtt DailyKartLoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: true

Outputs:
  WebsiteURL:
    Description: Website URL (HTTP until HTTPS is enabled)
    Value: !If
      - CreateHttpsCondition
      - !Sub 'https://${DomainName}'
      - !Sub 'http://${DomainName}'

  WwwWebsiteURL:
    Description: www website URL (HTTP until HTTPS is enabled)
    Value: !If
      - CreateHttpsCondition
      - !Sub 'https://www.${DomainName}'
      - !Sub 'http://www.${DomainName}'

  LoadBalancerDNS:
    Description: Application Load Balancer DNS name
    Value: !GetAtt DailyKartLoadBalancer.DNSName

  Route53HostedZoneId:
    Description: Route 53 public hosted zone ID
    Value: !Ref DailyKartHostedZone

  Route53NameServers:
    Description: Set these four name servers at your domain registrar
    Value: !Join [', ', !GetAtt DailyKartHostedZone.NameServers]

  DatabaseEndpoint:
    Description: Private MySQL endpoint
    Value: !GetAtt DailyKartRDS.Endpoint.Address

  DatabaseSecretArn:
    Description: ARN of the generated database credentials in Secrets Manager
    Value: !Ref DailyKartDatabaseSecret

  ApplicationInstanceId:
    Description: EC2 instance ID for AWS Systems Manager access
    Value: !Ref DailyKartEC2
